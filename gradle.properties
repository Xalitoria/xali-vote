kotlin.code.style=official
# Used by the plugin versions in settings.gradle.kts, which cannot read the catalog; keep it equal to `kotlin` in xali-gradle's libs.versions.toml.
kotlin.version=2.4.20

org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx4G

# :vote declares one JVM target per platform and builds its own source set hierarchy.
kotlin.mpp.applyDefaultHierarchyTemplate=false
kotlin.internal.suppressGradlePluginErrors=KotlinTargetAlreadyDeclaredError
