# The vote menu, opened by /vote. XaliVote writes this file when it is missing (menu.write-menus), and it is a plain XaliMenu menu
# from then on: change the look freely.
#
# Every place to vote is one element of the `xalivote:links` catalog: {index}, {name}, {url}, {host} and {description}. A menu cannot
# open a web page, so the `xalivote:link` action tells the player the link in chat, where it can be clicked. The values of an element
# are shown without colors; the party item reads its numbers from PlaceholderAPI (%xalivote_...%).
title = "&8Vote &7({page}/{pages})"
size = 54
register = false
refresh = 30s
# The last row holds the buttons: previous page, your votes, top voters, close, the party, next page.
layout = ["#########", "#xxxxxxx#", "#xxxxxxx#", "#xxxxxxx#", "#xxxxxxx#", "<#mtc#r#>"]
legend { "#" = border, "<" = prev, ">" = next, m = me, t = top, c = close, r = party }
pages {
  catalog { type = "xalivote:links" }
  layout = ["#########", "#xxxxxxx#", "#xxxxxxx#", "#xxxxxxx#", "#xxxxxxx#", "####p####"]
  cell = "x"
  item {
    material = "paper"
    name = "&a{name}"
    lore = ["&7{description}", "", "&8{host}", "&eClick to get the link"]
    click.any.actions = [{ type = "xalivote:link", url = "{url}", name = "{name}" }, { type = "close" }]
  }
  empty {
    material = "barrier"
    name = "&cNowhere to vote yet"
    lore = ["&7The server has not listed a site."]
  }
}
items {
  border { material = "gray_stained_glass_pane", name = " " }
  prev {
    material = "arrow"
    name = "&aPrevious page"
    view.require = [{ condition { type = "compare", left = "{page}", op = "GT", right = "1" } }]
    click.any.actions = [{ type = "page", by = -1 }]
  }
  next {
    material = "arrow"
    name = "&aNext page"
    view.require = [{ condition { type = "compare", left = "{page}", op = "LT", right = "{pages}" } }]
    click.any.actions = [{ type = "page", by = 1 }]
  }
  me {
    material = "player_head"
    name = "&eYour votes"
    lore = ["&f%xalivote_votes%"]
    update = true
  }
  party {
    material = "firework_rocket"
    name = "&6Vote party"
    lore = ["&f%xalivote_party_progress%&7 of &f%xalivote_party_needed%&7 votes", "&7Everyone online gets a reward when it is full."]
    update = true
  }
  top { material = "gold_ingot", name = "&eTop voters", click.any.actions = [{ type = "open", menu = "votetop" }] }
  close { material = "barrier", name = "&cClose", click.any.actions = [{ type = "close" }] }
}
