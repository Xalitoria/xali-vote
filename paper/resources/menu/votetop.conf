# The menu of the top voters, opened by /vote top and by a click in the vote menu. XaliVote writes this file when it is missing
# (menu.write-menus).
#
# Every place is one element of the `xalivote:top` catalog: {position}, {name}, {votes} and {uuid}. The first places are kept in
# memory (top.size), so the menu never waits for the database.
title = "&8Top voters &7({page}/{pages})"
size = 54
register = false
refresh = 30s
# The last row holds the buttons: previous page, vote, close, next page.
layout = ["#########", "#xxxxxxx#", "#xxxxxxx#", "#xxxxxxx#", "#xxxxxxx#", "<##vc###>"]
legend { "#" = border, "<" = prev, ">" = next, v = vote, c = close }
pages {
  catalog { type = "xalivote:top" }
  layout = ["#########", "#xxxxxxx#", "#xxxxxxx#", "#xxxxxxx#", "#xxxxxxx#", "####p####"]
  cell = "x"
  item {
    material = "head:{name}"
    name = "&e#{position} &f{name}"
    lore = ["&7{votes} votes"]
    update = true
  }
  empty {
    material = "barrier"
    name = "&cNobody yet"
    lore = ["&7Nobody has voted."]
  }
}
items {
  border { material = "gray_stained_glass_pane", name = " " }
  prev {
    material = "arrow"
    name = "&aPrevious page"
    view.require = [{ condition { type = "compare", left = "{page}", op = "GT", right = "1" } }]
    click.any.actions = [{ type = "page", by = -1 }]
  }
  next {
    material = "arrow"
    name = "&aNext page"
    view.require = [{ condition { type = "compare", left = "{page}", op = "LT", right = "{pages}" } }]
    click.any.actions = [{ type = "page", by = 1 }]
  }
  vote { material = "paper", name = "&aVote", click.any.actions = [{ type = "open", menu = "vote" }] }
  close { material = "barrier", name = "&cClose", click.any.actions = [{ type = "close" }] }
}
